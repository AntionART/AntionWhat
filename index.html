<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Todo ocurre en este navegador: sin servidores, sin analítica, sin fuentes ni librerías externas. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Visor local de copias de WhatsApp exportadas con AntionWhat. Combina varias copias, busca y consulta tus chats sin subir nada a internet.">
<title>AntionWhat · Visor de copias</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/></symbol>
<symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
<symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2 2 9.3l6.9-1z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.4 8.4 0 0 1 8.5 8z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
</svg>

<div id="app">
  <aside id="side">
    <div class="brand">
      <img class="mark" src="assets/logo.png" alt="" width="40" height="40">
      <button class="brand-txt" id="go-home" type="button" title="Inicio">
        <b>AntionWhat</b><span id="side-sub">Visor de copias</span>
      </button>
      <button class="icon-btn" id="theme" type="button" title="Cambiar tema"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
    <div class="actions">
      <button class="btn primary" id="pick-folder" type="button"><svg class="ic"><use href="#i-folder"/></svg>Cargar carpeta</button>
      <button class="btn" id="pick-files" type="button"><svg class="ic"><use href="#i-upload"/></svg>Archivos</button>
    </div>
    <label class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Buscar chats o mensajes" autocomplete="off" spellcheck="false">
    </label>
    <div class="list-tools">
      <div class="chips" id="chips">
        <button class="chip on" data-f="all" type="button">Todos</button>
        <button class="chip" data-f="media" type="button">Con archivos</button>
        <button class="chip" data-f="fav" type="button">Favoritos</button>
        <button class="chip" data-f="multi" type="button">En varias copias</button>
      </div>
      <select id="sort" title="Ordenar">
        <option value="recent">Recientes</option>
        <option value="name">Nombre</option>
        <option value="count">Más mensajes</option>
      </select>
    </div>
    <div id="list" role="list"></div>
  </aside>

  <main id="main">
    <section id="home" class="home"></section>

    <section id="conv" hidden>
      <header class="head">
        <button class="icon-btn" id="back" type="button" title="Volver"><svg class="ic"><use href="#i-back"/></svg></button>
        <div class="avatar sm" id="h-av"></div>
        <div class="who"><b id="h-name"></b><span id="h-sub"></span></div>
        <button class="icon-btn" id="find-open" type="button" title="Buscar en el chat (Ctrl+F)"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="fav" type="button" title="Favorito"><svg class="ic"><use href="#i-star"/></svg></button>
        <button class="icon-btn" id="export-chat" type="button" title="Descargar este chat (JSON)"><svg class="ic"><use href="#i-download"/></svg></button>
        <button class="icon-btn" id="delete-chat" type="button" title="Quitar este chat del visor"><svg class="ic"><use href="#i-trash"/></svg></button>
      </header>
      <div class="find" id="find">
        <input id="find-q" type="search" placeholder="Buscar en esta conversación" autocomplete="off">
        <span class="count" id="find-n"></span>
        <button class="icon-btn" id="find-prev" type="button" title="Anterior (Enter)"><svg class="ic"><use href="#i-up"/></svg></button>
        <button class="icon-btn" id="find-next" type="button" title="Siguiente (Shift+Enter)"><svg class="ic"><use href="#i-down"/></svg></button>
        <button class="icon-btn" id="find-close" type="button" title="Cerrar (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div id="thread" class="thread"><div class="thread-inner" id="msgs"></div></div>
      <button id="fab" type="button" title="Ir al final"><svg class="ic"><use href="#i-down"/></svg></button>
    </section>
  </main>
</div>

<div id="drop" hidden><div><svg class="ic"><use href="#i-upload"/></svg><b>Suelta para importar</b><span>Carpetas o archivos de AntionWhat y WhatsApp</span></div></div>

<div id="lb">
  <div class="lb-bar">
    <span class="t" id="lb-t"></span>
    <a class="icon-btn" id="lb-open" target="_blank" rel="noopener" title="Abrir original"><svg class="ic"><use href="#i-download"/></svg></a>
    <button class="icon-btn" id="lb-x" type="button" title="Cerrar (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="stage">
    <button class="icon-btn nav" id="lb-prev" type="button" title="Anterior (←)"><svg class="ic"><use href="#i-left"/></svg></button>
    <div class="media" id="lb-media"></div>
    <button class="icon-btn nav" id="lb-next" type="button" title="Siguiente (→)"><svg class="ic"><use href="#i-right"/></svg></button>
  </div>
</div>

<div id="modal" hidden><div class="dialog" role="dialog" aria-modal="true">
  <h3 id="modal-title"></h3><p id="modal-msg"></p>
  <div class="dialog-btns"><button class="btn" id="modal-cancel" type="button">Cancelar</button><button class="btn danger" id="modal-ok" type="button">Aceptar</button></div>
</div></div>
<div id="toast" role="status"></div>

<input type="file" id="in-folder" webkitdirectory multiple hidden>
<input type="file" id="in-files" multiple accept=".json,.html,.htm,.txt,image/*,video/*,audio/*,.pdf,.opus" hidden>

<script src="assets/core.js"></script>
<script src="assets/store.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
